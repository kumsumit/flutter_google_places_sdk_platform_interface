name: flutter_google_places_sdk_platform_interface
description: A common platform interface for accessing google maps native sdk on various platforms
version: 0.4.0
homepage: https://github.com/matanshukry/flutter_google_places_sdk/tree/master/flutter_google_places_sdk_platform_interface
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation:
    git: https://github.com/kumsumit/freezed_annotation.git
  json_annotation: ^4.12.0
  plugin_platform_interface: 
    git: https://github.com/kumsumit/plugin_platform_interface.git

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: 
    git: https://github.com/kumsumit/freezed.git
  json_serializable: ^6.13.2
  mockito: ^5.8.1

flutter:
  assets:
    - assets/google/
